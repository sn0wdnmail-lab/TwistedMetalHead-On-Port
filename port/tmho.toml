# PCSX2 GameIndex fix for this disc (author: refraction): "COP2 rearrangement. RSQRT directly
# followed by DIV and a few ops using Q causes issues. Fixes fire effects." The hardware's Q
# register still holds the RSQRT result while the following DIV runs; the reordered code gets the
# same values with Q written at once. The second sequence is the dynamic point-light loop
# (missile lights).
# COP2 (VU0 macro) fixes from PCSX2's GameIndex entry for SCUS-97621 (by refraction): two
# instruction sequences read a VU0 result one cycle earlier than the real hardware lets them,
# which shows up as wrong lighting. The recompiler writes these words in place of the originals.
[patches]
instructions = [
  { address = "0x00237eb0", value = "0x4b000060" },
  { address = "0x00237ec0", value = "0x4a0203bd" },
  { address = "0x002461d8", value = "0x4bf4b33c" },
  { address = "0x002461dc", value = "0x4b806d9c" },
  { address = "0x002461e0", value = "0x4bc069fc" },
  { address = "0x002461e4", value = "0x4a54c3bc" },
]
